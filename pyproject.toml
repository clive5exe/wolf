[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradeos"
version = "0.1.0"
description = "AI portfolio-management runtime. The model advises; deterministic code decides. Experimental. Not investment advice."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "TradeOS contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "textual>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
# `wolf` is the product's command (free on Homebrew and PATH); `tradeos` stays
# as an alias because the PyPI distribution name `wolf` is already taken — see
# specs/decisions/ADR-0012-product-name.md.
wolf = "tradeos.cli.main:main"
tradeos = "tradeos.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tradeos"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Vendored third-party code is kept byte-for-byte upstream apart from the
# import fixes documented in src/tradeos/vendor/README.md. Linting it would
# only invite edits that the next update silently drops.
extend-exclude = ["src/tradeos/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "DTZ"]
ignore = [
  "SIM108", # ternary is not always clearer
  "RUF002", # deliberate typography (en dashes, math signs) in docstrings
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ"] # tests may build naive fixtures deliberately
# TUI tests assert on the same deliberate typography the widgets render.
"tests/unit/test_tui*.py" = ["DTZ", "RUF001"]
# The TUI's typography is the product: − (true minus) keeps numeric columns
# aligned, and ◆ ┼ ● ◐ ○ are the drift/freshness vocabulary.
"src/tradeos/tui/**" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict_equality = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "textual.*"
ignore_missing_imports = true

# Vendored code is not ours to annotate. See src/tradeos/vendor/README.md.
[[tool.mypy.overrides]]
module = "tradeos.vendor.*"
ignore_errors = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:tradeos.*"]
